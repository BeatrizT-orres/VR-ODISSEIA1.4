<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <title>VR-ODISSEIA</title>
</head>
<body>
    <a-scene>
        <a-camera position="3.5 2 2">
            <a-cursor fuse-timeout="3000" color="red" raycaster="objects: .clickable" fuse="true"></a-cursor>
        </a-camera>
        
        <a-assets>
    <!-- Carrega o audio nos assets -->
    <audio id="audio-menu" src="./musicas/audiomenu.mp3" preload="auto"></audio>
  </a-assets>

  <!-- Toca automático, em loop, no centro da cena -->
  <a-entity
    sound="src: #audio-menu; autoplay: true; loop: true; volume: 1"
    position="0 0 0">
  </a-entity>
        <!--        imagens transição         -->
        <a-assets>
        <a-img id="cenario-menu" src="./imagens/espaco.png" alt="céu paraiso"></a-img>
        </a-assets>

        <a-assets>
            <img id="portal" src="imagens/portaMenu.png" alt="">
        </a-assets>

        <a-assets>
            <img id="cenario-1" src="imagens/portaEspaco.png" alt="">
        </a-assets>

        <a-assets>
            <img id="cenario-2" src="./imagens/portaBack.png" alt="">
        </a-assets>

        <a-assets>
            <img  id="cenario-3" src="./imagens/portaNeve.png" alt="">
        </a-assets>

        <a-assets>
            <img id="logo-game-vr" src="./imagens/logovr.png"></img>
        </a-assets>

        <!-- FIM -->

        <!--PORTAS DOCTOR WHO-->
        <!-- Botões de cenário com imagens -->
        <a-image src="#cenario-1" position="-2 2 3" rotation="0 100 0" scenario="#cenario-1" width="4" height="4"
        animation="property: position; dir: alternate; 
        dur: 2000; easing: easeInOutSine; loop: true; to: -2 2.5 3"></a-image>

        <a-image src="#cenario-2" position="3 2 -4" scenario="#cenario-2" width="4" 
        height="4" animation="property: position; dir: alternate; 
        dur: 2000; easing: easeInOutSine; loop: true; to: 3 2.5 -4"></a-image>

        <a-image src="#cenario-3" position="9 2 1.2" scenario="#cenario-3" rotation="0 100 0" width="4" height="4"
         animation="property: position; dir: alternate; 
        dur: 2000; easing: easeInOutSine; loop: true; to: 9 2.5 1.2"></a-image>

        <a-image src="#portal" position="4.5 2 5" scenario="#portal" rotation="0 200 0" width="4" height="4"
        animation="property: position; dir: alternate; 
        dur: 2000; easing: easeInOutSine; loop: true; to: 4.5 2.5 5"></a-image>

        <a-image src="#logo-game-vr" position="3 10 0" rotation="100 0 0" height="9" width="9"></a-image>

        <a-link
        class="clickable"
        href="https://youtu.be/7WMmAuYsInY?si=nnuaejFla30fAVlQ"
        title=""
        image="#cenario-1"
        position="-3 2 3"
        rotation="0 100 0"
        >
        </a-link>

        <a-link
        class="clickable"
        href="https://youtu.be/6v_4XAUkJmA?si=HpPXT5giPCOMypqs"
        title=""
        image="#cenario-2"
        position="3 2 -5"
        >
        </a-link>


        <a-link
        class="clickable"
        href="https://youtu.be/XTXPYJH8E2I?si=25wBv0evxM3ZwGw8"
        title=""
        image="#cenario-3"
        position="9 2 1"
        rotation="0 100 0"
        >
        </a-link>

        <a-link
        class="clickable"
        href="index.html"
        title="Experiencia"
        image="#portal"
        position="4.5 2 6"
        rotation="0 0 0"
        >
        </a-link>

        <a-sky src="#cenario-menu"></a-sky>
    </a-scene>
</body>
</html>
